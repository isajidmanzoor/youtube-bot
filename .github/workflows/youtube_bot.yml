name: Advanced YouTube Bot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  actions: write


concurrency:
  group: advanced-youtube-bot
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: self-hosted
    env:
      RUNNER_TOOL_CACHE: /Users/apple/actions-runner-toolcache
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Set tool cache path
        run: echo "RUNNER_TOOL_CACHE=/Users/apple/actions-runner-toolcache" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        # Install only what is missing: Homebrew no longer has bottles for Intel Macs,
        # so an upgrade can mean building from source for a long time on every run
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          for f in ffmpeg imagemagick; do
            brew list "$f" >/dev/null 2>&1 || brew install "$f" || true
          done
      - name: Python packages
        run: |
          pip install -r requirements.txt
          sed -i '' "s/Image.ANTIALIAS/Image.LANCZOS/g" $(python -c "import moviepy,os;print(os.path.dirname(moviepy.__file__))")/video/fx/resize.py || true
      - name: Inject secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          sed -i '' "s|YOUR_GROQ_API_KEY|$GROQ_API_KEY|g" config.py
          sed -i '' "s|YOUR_PEXELS_API_KEY|$PEXELS_API_KEY|g" config.py
      - name: YouTube credentials
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > youtube_token.pickle
      - name: Create folders
        run: mkdir -p output/videos output/audio output/thumbnails output/music output/shorts logs brain
      - name: Run Advanced Bot
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          VECLIB_MAXIMUM_THREADS: "4"
          NUMEXPR_NUM_THREADS: "4"
        run: |
          for attempt in 1 2 3; do
            # Without Groq the script falls back to a template that the uniqueness
            # gate rejects, so wait (up to 30 min) for the Mac to reach the APIs first
            for i in $(seq 1 30); do
              if curl -s -m 15 -o /dev/null https://api.groq.com/openai/v1/models \
                 && curl -s -m 15 -o /dev/null https://api.pexels.com/v1/; then
                break
              fi
              echo "No internet / DNS for the APIs yet ($i/30), waiting 60s..."
              sleep 60
            done
            echo "Attempt $attempt of 3..."
            if python advanced_main.py; then
              echo "Success on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting before retry..."
            sleep 30
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Trigger next run
        # Keep the loop alive after a failed run too; wait first so a lasting
        # problem (API limit, expired token) does not retrigger every few minutes
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "Run failed, waiting 20 minutes before the next one..."
            sleep 1200
          fi
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/youtube_bot.yml/dispatches \
            -d '{"ref":"main"}'
