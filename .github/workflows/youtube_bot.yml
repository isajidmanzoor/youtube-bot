name: YouTube Bot Auto Upload

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom topic (optional)"
        required: false
        default: ""

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Inject secrets into config
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          sed -i "s|YOUR_GROQ_API_KEY|$GROQ_API_KEY|g" config.py
          sed -i "s|YOUR_PEXELS_API_KEY|$PEXELS_API_KEY|g" config.py

      - name: Restore YouTube credentials
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > youtube_token.pickle

      - name: Run YouTube Bot
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py "${{ github.event.inputs.topic }}"
          else
            python main.py
          fi

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
