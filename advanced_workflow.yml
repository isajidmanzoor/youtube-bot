name: Advanced YouTube Bot — Auto Upload

on:
  schedule:
    - cron: "0 3 * * *"    # 8:00 AM PKT
    - cron: "0 6 * * *"    # 11:00 AM PKT
    - cron: "0 9 * * *"    # 2:00 PM PKT
    - cron: "0 12 * * *"   # 5:00 PM PKT
    - cron: "0 14 * * *"   # 7:00 PM PKT
    - cron: "0 16 * * *"   # 9:00 PM PKT

  workflow_dispatch:
    inputs:
      topic:
        description: "Custom topic (leave blank for auto)"
        required: false
        default: ""

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick
          echo "✅ System deps installed"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install gTTS Pillow
          sed -i "s/Image.ANTIALIAS/Image.LANCZOS/g" $(python -c "import moviepy, os; print(os.path.dirname(moviepy.__file__))")/video/fx/resize.py || true
          echo "✅ Python packages installed"

      - name: Inject secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          sed -i "s|YOUR_GROQ_API_KEY|$GROQ_API_KEY|g" config.py
          sed -i "s|YOUR_PEXELS_API_KEY|$PEXELS_API_KEY|g" config.py
          echo "✅ Secrets injected"

      - name: Restore YouTube credentials
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > youtube_token.pickle
          echo "✅ YouTube credentials restored"

      - name: Create output folders
        run: |
          mkdir -p output/videos output/audio output/thumbnails logs
          echo "✅ Folders created"

      - name: Run Advanced YouTube Bot
        run: |
          echo "🚀 Starting Advanced Video Generation..."
          python advanced_youtube_bot/advanced_main.py
          echo "✅ Done!"

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
