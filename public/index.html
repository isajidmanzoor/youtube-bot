<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Studio Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d10;
        --panel: #121820;
        --panel-2: #17202a;
        --text: #edf2f7;
        --muted: #9aa8b6;
        --line: #2b3643;
        --green: #41d39b;
        --blue: #5fb3ff;
        --amber: #ffc65a;
        --red: #ff6b6b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 18px 42px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-end;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 46px);
        line-height: 1.05;
      }

      .topic, .muted { color: var(--muted); }
      .status {
        min-width: 170px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: .08em;
        font-size: 12px;
        color: var(--green);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 14px;
        margin-top: 18px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 15px;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .wide { grid-column: span 8; }
      .side { grid-column: span 4; }
      .full { grid-column: 1 / -1; }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        min-height: 78px;
      }

      .metric strong {
        display: block;
        font-size: 26px;
        margin-bottom: 4px;
      }

      .pipeline {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
      }

      .step {
        border: 1px solid var(--line);
        border-left: 3px solid var(--blue);
        border-radius: 6px;
        padding: 10px;
        background: var(--panel-2);
        min-height: 58px;
      }

      .scores {
        display: grid;
        gap: 8px;
      }

      .score {
        display: grid;
        grid-template-columns: 92px 1fr 44px;
        align-items: center;
        gap: 10px;
      }

      .bar {
        height: 8px;
        background: #26313c;
        border-radius: 99px;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: 0%;
        background: var(--green);
      }

      .errors {
        color: var(--red);
        white-space: pre-wrap;
      }

      @media (max-width: 820px) {
        header { display: block; }
        .status { margin-top: 14px; }
        .wide, .side { grid-column: 1 / -1; }
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>AI Studio Dashboard</h1>
          <div class="topic" id="topic">Loading studio state...</div>
        </div>
        <div class="status" id="status">Loading</div>
      </header>

      <div class="grid">
        <section class="wide">
          <h2>Analytics AI</h2>
          <div class="metrics" id="metrics"></div>
        </section>

        <section class="side">
          <h2>Quality Gate</h2>
          <div class="scores" id="scores"></div>
        </section>

        <section class="full">
          <h2>AI Operating Pipeline</h2>
          <div class="pipeline" id="pipeline"></div>
        </section>

        <section class="wide">
          <h2>Research Swarm</h2>
          <p id="research" class="muted"></p>
        </section>

        <section class="side">
          <h2>Errors</h2>
          <div id="errors" class="errors muted">No errors</div>
        </section>
      </div>
    </main>

    <script>
      const metricLabels = {
        viral_probability: "Viral %",
        expected_views: "Views",
        ctr: "CTR %",
        retention: "Retention %",
        rpm: "RPM",
        subscribers: "Subs",
        shares: "Shares",
        comments: "Comments"
      };

      async function loadStatus() {
        const res = await fetch("/api/status", { cache: "no-store" });
        const data = await res.json();
        document.getElementById("status").textContent = data.status || "waiting";
        document.getElementById("topic").textContent = data.active_topic || "No active topic yet";

        const analytics = data.analytics || {};
        document.getElementById("metrics").innerHTML = Object.entries(metricLabels)
          .map(([key, label]) => `<div class="metric"><strong>${analytics[key] ?? "-"}</strong><span class="muted">${label}</span></div>`)
          .join("");

        const scores = (data.quality_gate && data.quality_gate.scores) || {};
        document.getElementById("scores").innerHTML = Object.entries(scores)
          .map(([key, value]) => `<div class="score"><span>${key}</span><div class="bar"><div class="fill" style="width:${Math.min(value, 100)}%"></div></div><span>${value}</span></div>`)
          .join("") || "<span class='muted'>No quality gate yet</span>";

        document.getElementById("pipeline").innerHTML = (data.pipeline || [])
          .map((step) => `<div class="step"><strong>${step.name}</strong><div class="muted">${step.status || "ready"}</div></div>`)
          .join("") || "<span class='muted'>Pipeline waiting for first run</span>";

        const research = data.research || {};
        document.getElementById("research").textContent = `${research.agents || 0} agents | ${research.consensus || "No consensus yet"}`;

        const errors = data.errors || [];
        document.getElementById("errors").textContent = errors.length
          ? errors.map((item) => `${item.at || ""} ${item.message || item}`).join("\n")
          : "No errors";
      }

      loadStatus();
      setInterval(loadStatus, 10000);
    </script>
  </body>
</html>
